<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Avalie nossa loja</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .caixa {
            background-color: white;
            width: 90%;
            max-width: 500px;

            padding: 40px;
            text-align: center;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .botao {
            display: block;

            background-color: #4285F4;
            color: white;

            padding: 15px;

            border-radius: 8px;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="caixa">

        <h1>Obrigado pela visita!</h1>

        <p>
            Sua opinião é muito importante para nós.
        </p>

        <a
        class="botao"
        href="https://g.page/r/CSlAj-AQGt5mEBM/review"
        target="_blank">
        Avaliar nossa loja no Google
        </a>

    </div>

</body>

</html>
